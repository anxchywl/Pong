name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Validate repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Validate Unity project files
        run: ./ci/validate-project.sh

  tests:
    name: Run Unity tests
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Check out repository
        if: ${{ env.UNITY_LICENSE != '' }}
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955

      - name: Run tests
        if: ${{ env.UNITY_LICENSE != '' }}
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9
        with:
          testMode: all

      - name: Explain missing Unity license
        if: ${{ env.UNITY_LICENSE == '' }}
        run: echo "UNITY_LICENSE is not configured; repository validation still ran, but Unity tests were skipped."
