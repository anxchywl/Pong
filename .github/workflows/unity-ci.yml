name: Unity CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build Unity project
    runs-on: ubuntu-latest
    env:
      UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
    steps:
      - name: Checkout
        if: ${{ env.UNITY_LICENSE != '' }}
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build project
        if: ${{ env.UNITY_LICENSE != '' }}
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: StandaloneLinux64
          versionChangeset: ${{ github.sha }}

      - name: Upload build artifact
        if: ${{ env.UNITY_LICENSE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: pong-linux-${{ github.sha }}
          path: build/

      - name: Explain missing Unity license
        if: ${{ env.UNITY_LICENSE == '' }}
        run: echo "UNITY_LICENSE is not configured; Unity build is skipped. Add it in repository Settings > Secrets and variables > Actions."
